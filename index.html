<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siena Dusk Theme Colors</title>
<style>
  body {
    margin: 0;
    display: flex;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
  }
  .color-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 10px;
  }
  .color-name {
    font-size: 1.2em;
    font-weight: bold;
  }
  .hex {
    font-size: 1em;
    opacity: 0.9;
  }
</style>
</head>
<body>

  <div class="color-column" style="background-color: #12181c; color: #fff;">
    <div class="color-name">Background</div>
    <div class="hex">#12181c</div>
  </div>

  <div class="color-column" style="background-color: #f2efe9; color: #000;">
    <div class="color-name">Foreground</div>
    <div class="hex">#f2efe9</div>
  </div>

  <div class="color-column" style="background-color: #7a913c; color: #fff;">
    <div class="color-name">Green</div>
    <div class="hex">#7a913c</div>
  </div>

  <div class="color-column" style="background-color: #d19a66; color: #000;">
    <div class="color-name">Creme</div>
    <div class="hex">#d19a66</div>
  </div>

  <div class="color-column" style="background-color: #a86c4c; color: #fff;">
    <div class="color-name">Brownish</div>
    <div class="hex">#a86c4c</div>
  </div>

  <div class="color-column" style="background-color: #6f4c3a; color: #fff;">
    <div class="color-name">Brown</div>
    <div class="hex">#6f4c3a</div>
  </div>

  <div class="color-column" style="background-color: #34495e; color: #fff;">
    <div class="color-name">Dark Blue</div>
    <div class="hex">#34495e</div>
  </div>

  <div class="color-column" style="background-color: #ba6f5d; color: #fff;">
    <div class="color-name">Light Red</div>
    <div class="hex">#ba6f5d</div>
  </div>

  <div class="color-column" style="background-color: #b45a44; color: #fff;">
    <div class="color-name">Red</div>
    <div class="hex">#b45a44</div>
  </div>

  <div class="color-column" style="background-color: #92a8b6; color: #000;">
    <div class="color-name">Light Blue</div>
    <div class="hex">#92a8b6</div>
  </div>

  <div class="color-column" style="background-color: #71797f; color: #000;">
    <div class="color-name">Light Gray</div>
    <div class="hex">#71797f</div>
  </div>

  <div class="color-column" style="background-color: #e7b97b; color: #000;">
    <div class="color-name">Light Creme</div>
    <div class="hex">#e7b97b</div>
  </div>

  <div class="color-column" style="background-color: #9c5938; color: #fff;">
    <div class="color-name">Cocoa</div>
    <div class="hex">#9c5938</div>
  </div>

</body>
</html>
